name: Deploy

run-name: >-
  Deploy produção (${{ github.ref_name }})
  · ${{ github.event_name == 'push' && 'automático' || github.actor }}

# - main: automático. Todo push (inclui merge de PR) na main roda lint, build e
#   testes e, se passarem, publica — deploy contínuo, sem intervenção.
# - develop: manual. Aba Actions → Deploy → "Run workflow", escolhendo a branch.
#   O botão também serve para republicar a main. Outras branches são recusadas.
#
# Usa `push` (e não `workflow_run` disparado pelo CI) de propósito: `push` só
# roda com código que já está no repositório, nunca com código de PR de fork,
# então os secrets de produção não ficam expostos a código não confiável.
# Todos os checkouts usam o commit do próprio evento (github.sha).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Bloqueia deploy manual de branches que não sejam main ou develop.
  guard:
    name: Validar branch
    runs-on: ubuntu-latest
    steps:
      - name: Validar branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main|develop) echo "Publicando $BRANCH" ;;
            *) echo "::error::Só as branches main e develop podem ser publicadas (recebido: $BRANCH)"; exit 1 ;;
          esac

  checks:
    name: Lint, Build & Test (${{ github.ref_name }})
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage (fails below 75%)
        run: npm run test:coverage

  build:
    name: Build da imagem (arm64)
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Só um booleano: o token em si fica restrito ao passo que o usa.
      HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O runner do GitHub Actions é amd64; o QEMU habilita compilar para
      # outra arquitetura (arm64) nele via emulação.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A instância EC2 é t4g.micro (Graviton/ARM), por isso a imagem é
      # construída para linux/arm64 e não para a arquitetura do runner.
      # A tag :latest só aponta para a main; a develop recebe apenas a tag do SHA.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Source maps para o Sentry: exporta o estágio `sourcemaps` do Dockerfile
      # (o dist/ da imagem, com Debug IDs). Sai todo do cache do passo anterior,
      # então os arquivos são os mesmos da imagem publicada.
      - name: Export dist for Sentry
        if: env.HAS_SENTRY_TOKEN == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          target: sourcemaps
          outputs: type=local,dest=sentry-dist
          cache-from: type=gha

      # Falha aqui não bloqueia o deploy: o Sentry continua recebendo os erros,
      # só com a stack trace apontando para o JS compilado.
      - name: Upload source maps to Sentry
        if: env.HAS_SENTRY_TOKEN == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: vagare-app
          SENTRY_PROJECT: vagare-backend
          SENTRY_RELEASE: ${{ github.sha }}
        # Mesma versão do @sentry/cli do package.json.
        run: |
          npx --yes @sentry/cli@3.8.2 releases new "$SENTRY_RELEASE"
          npx --yes @sentry/cli@3.8.2 sourcemaps upload --release "$SENTRY_RELEASE" sentry-dist

  deploy:
    name: Deploy na EC2
    needs: build
    runs-on: ubuntu-latest
    # Não configure "Required reviewers" neste ambiente: isso faria o deploy da
    # main esperar aprovação e deixaria de ser automático.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      # Falha antes de qualquer acesso à AWS se o secret estiver ausente ou fraco.
      # Só letras, números, "_" e "-": a senha vai dentro da DATABASE_URL e de
      # um comando SQL, e assim não precisa de escape em nenhum dos dois.
      # Gere com: openssl rand -hex 32
      - name: Validate POSTGRES_PASSWORD secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          case "$POSTGRES_PASSWORD" in
            ''|*[!A-Za-z0-9_-]*)
              echo "::error::Secret POSTGRES_PASSWORD ausente ou com caracteres não permitidos (use só A-Z, a-z, 0-9, _ e -)."
              exit 1 ;;
          esac
          if [ "${#POSTGRES_PASSWORD}" -lt 20 ] || [ "$POSTGRES_PASSWORD" = "postgres" ]; then
            echo "::error::Secret POSTGRES_PASSWORD precisa ter pelo menos 20 caracteres."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Checkout
        uses: actions/checkout@v4

      # O deploy não usa SSH: o comando vai pelo AWS Systems Manager (SSM) e a
      # porta 22 nem precisa ser aberta. Os segredos vão antes para o Parameter
      # Store, cifrados (SecureString), e a EC2 os lê com a própria role; assim
      # não aparecem no histórico de comandos do SSM. O GHCR_TOKEN é o token
      # deste job e expira quando ele termina.
      - name: Store deploy secrets in Parameter Store
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          put() {
            aws ssm put-parameter --cli-input-json "$(jq -n --arg n "/vagare/prod/$1" --arg v "$2" \
              '{Name: $n, Value: $v, Type: "SecureString", Overwrite: true}')" > /dev/null
          }
          put POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
          put GHCR_TOKEN "$GHCR_TOKEN"
          # O Parameter Store não aceita valor vazio: "-" = Sentry desligado.
          put SENTRY_DSN "${SENTRY_DSN:--}"

      # O servidor não tem o repositório clonado: só a imagem chega lá via
      # registry. O compose de produção e o script de deploy vão dentro do
      # comando (em base64), então a EC2 usa a versão do mesmo commit da imagem.
      - name: Deploy via SSM Run Command
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          IMAGE_TAG: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=vagare-backend" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::Instância vagare-backend não encontrada em execução."
            exit 1
          fi

          COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)
          SCRIPT_B64=$(base64 -w0 scripts/deploy-remote.sh)
          PARAMS=$(jq -n --arg dir "$APP_DIR" --arg tag "$IMAGE_TAG" --arg actor "$GH_ACTOR" \
            --arg region "$AWS_REGION" --arg compose "$COMPOSE_B64" --arg script "$SCRIPT_B64" \
            '{commands: [
               "set -e",
               "echo \($compose) | base64 -d > \($dir | @sh)/docker-compose.prod.yml",
               "echo \($script) | base64 -d | APP_DIR=\($dir | @sh) IMAGE_TAG=\($tag | @sh) GH_ACTOR=\($actor | @sh) AWS_REGION=\($region | @sh) bash"
             ],
             executionTimeout: ["600"]}')

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "Deploy $IMAGE_TAG" \
            --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          echo "Comando SSM: $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 130); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          echo "::group::Saída do deploy na EC2"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "::endgroup::"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy na EC2 terminou com status $STATUS."
            exit 1
          fi

      # Marca no Sentry que este commit está em produção (só depois do
      # /health/ready responder). Não bloqueia: o deploy já terminou.
      - name: Register deploy in Sentry
        if: success() && env.HAS_SENTRY_TOKEN == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: vagare-app
          SENTRY_PROJECT: vagare-backend
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          npx --yes @sentry/cli@3.8.2 releases finalize "$SENTRY_RELEASE"
          npx --yes @sentry/cli@3.8.2 deploys new --release "$SENTRY_RELEASE" --env production

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Deploy produção ${{ job.status == 'success' && '✅' || '❌' }}"
            echo
            echo "| Branch | Disparo | Commit | Imagem |"
            echo "|---|---|---|---|"
            echo "| ${{ github.ref_name }} | ${{ github.event_name == 'push' && 'automático' || 'manual' }} | \`${{ github.sha }}\` | \`ghcr.io/${{ github.repository }}:${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
