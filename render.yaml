databases:
  - name: vagare-db
    databaseName: vagare
    user: vagare
    plan: free
    region: oregon

services:
  - type: web
    name: vagare-backend
    runtime: docker
    repo: https://github.com/grazielatrres/portfolio-vagare-backend
    branch: develop
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vagare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM_NAME
        value: Vagare
      - key: RESET_PASSWORD_URL
        sync: false
