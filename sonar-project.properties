# SonarQube Cloud (SonarCloud) — análise estática, code smells, duplicação e segurança.
# Organização e chave seguem o padrão de import do GitHub no sonarcloud.io;
# ajuste se o projeto for criado com outros nomes.
sonar.organization=grazielatrres
sonar.projectKey=grazielatrres_portfolio-vagare-backend
sonar.projectName=Vagare Backend

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Cobertura gerada pelo `npm run test:coverage` no mesmo job do CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.ts,src/instrument.ts
