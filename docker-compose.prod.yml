services:
  postgres:
    image: postgres:16-alpine
    container_name: vagare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Vem do secret POSTGRES_PASSWORD do GitHub (exportado pelo deploy.yml).
      # Sem ele o compose falha em vez de subir com uma senha padrão.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: vagare
    volumes:
      - vagare_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vagare']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # IMAGE_TAG é o SHA do commit publicado, definido pelo workflow de deploy.
    # Sem ele (ex.: comando manual no servidor), usa a última imagem da main.
    image: ghcr.io/grazielatrres/portfolio-vagare-backend:${IMAGE_TAG:-latest}
    container_name: vagare-api
    restart: unless-stopped
    # Só em 127.0.0.1: o tráfego externo entra pelo nginx do host (HTTPS), que faz
    # proxy_pass para 127.0.0.1:3000. Assim ninguém fala com a API sem passar pelo
    # TLS nem forja X-Forwarded-For (ver trust proxy em src/app.ts). O health check
    # do deploy usa localhost e continua funcionando.
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/vagare?schema=public
      # Versão reportada ao Sentry: o SHA do commit publicado.
      SENTRY_RELEASE: ${IMAGE_TAG:-latest}
    # Rotação dos logs JSON do container (o disco da t4g.micro é pequeno).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vagare_pg_data:
