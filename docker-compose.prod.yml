services:
  postgres:
    image: postgres:16-alpine
    container_name: vagare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vagare
    volumes:
      - vagare_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vagare']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/grazielatrres/portfolio-vagare-backend:latest
    container_name: vagare-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vagare?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vagare_pg_data:
