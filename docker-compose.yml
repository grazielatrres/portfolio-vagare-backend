services:
  postgres:
    image: postgres:16-alpine
    container_name: vagare-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vagare
    volumes:
      - vagare_pg_data:/var/lib/postgresql/data

volumes:
  vagare_pg_data:
